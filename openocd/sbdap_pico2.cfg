# OpenOCD configuration for RP2350 targets (Pico 2 test board, RP2354B boards)
# with a CMSIS-DAP probe (e.g. SBDAP, Raspberry Pi Debug Probe) via SWD.
#
# Usage:
#   openocd -s <openocd>/scripts -f openocd/sbdap_pico2.cfg
#   openocd ... -c "program <firmware>.elf verify reset exit"
#
# No explicit "init" / "reset halt" here: OpenOCD runs init at the end of the
# configuration anyway, which works best for IDE/GDB sessions.

source [find interface/cmsis-dap.cfg]

transport select swd

# Select a specific probe if more than one CMSIS-DAP probe is connected:
# adapter serial <serial number>

# Prefer CMSIS-DAP v2 (USB bulk). Comment out if it causes trouble on Windows.
# cmsis-dap backend usb_bulk

# Conservative SWD clock for bring-up. 5000 kHz usually works as well.
adapter speed 1000

source [find target/rp2350.cfg]
